{% extends "base.html" %}
{% block title %}Edit: {{ filename }} — Brainstack{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap;">
    <a href="/view/{{ file_path }}" class="back-link" style="margin-bottom:0;">← Cancel</a>
    <span style="font-size:0.82rem; color:var(--text-muted); flex:1;">{{ file_path }}</span>
</div>

<form method="POST" action="/edit/{{ file_path }}">
    <textarea name="content" required>{{ content }}</textarea>
    <button type="submit" class="save-btn">💾 Save</button>
</form>

{% endblock %}
