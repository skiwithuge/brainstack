{% extends "base.html" %}
{% block title %}{{ filename }} — Brainstack{% endblock %}
{% block content %}

<style>
    .view-nav { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .breadcrumb { font-size: 0.82rem; color: var(--text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<div class="view-nav">
    <a href="javascript:history.back()" class="back-link" style="margin-bottom:0;">← Back</a>
    <span class="breadcrumb">{{ file_path }}</span>
    <a href="/edit/{{ file_path }}" class="btn btn-ghost">✏️ Edit</a>
</div>

<div class="card">
    <div class="prose">{{ content | safe }}</div>
</div>

{% endblock %}
